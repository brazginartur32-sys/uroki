<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Страх мамы</title>
<style>
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;src:url(fonts/inter-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;src:url(fonts/inter-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root{
  --bg:#000;
  --out:#dcf8c6; --out-time:#4aa64d;
  --in:#fff; --in-time:#a2a2a7;
  --blue:#3b8ef5; --icon:#8e8e93;
}
html,body{margin:0;width:576px;height:1024px;background:var(--bg);overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11" 0;}
#title{position:absolute;top:143px;left:0;right:0;text-align:center;color:#fff;font-size:35px;
  font-weight:500;line-height:43px;letter-spacing:-.4px}
#screen{position:absolute;top:240px;left:0;width:576px;height:543px;overflow:hidden;background:#f7f7f8}
#hdr{position:absolute;top:0;left:0;right:0;height:13px;background:#f7f7f8;z-index:5;overflow:hidden;
  border-bottom:.5px solid rgba(0,0,0,.18)}
#hdr .st{position:absolute;left:0;right:0;top:-13px;text-align:center;color:var(--blue);font-size:16px;font-weight:500}
#hdr .av{position:absolute;right:14px;top:-30px;width:40px;height:40px;border-radius:50%;
  background:linear-gradient(160deg,#ffb36b,#f0775a)}
#chat{position:absolute;top:13px;left:0;right:0;overflow:hidden}
#wall{position:absolute;inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 0% 45%, rgba(110,176,110,.75), transparent 75%),
    radial-gradient(ellipse 60% 55% at 100% 95%, rgba(96,170,112,.85), transparent 75%),
    radial-gradient(ellipse 60% 45% at 100% 0%, rgba(132,188,120,.6), transparent 75%),
    radial-gradient(ellipse 60% 60% at 55% 45%, rgba(220,226,162,.9), transparent 75%),
    linear-gradient(115deg,#8fc187 0%,#bcd496 38%,#d3dba0 55%,#b8d295 74%,#86bd86 100%);}
#doodles{position:absolute;inset:0;opacity:1}
#list{position:absolute;left:0;right:0;bottom:8px;display:flex;flex-direction:column;will-change:transform}
.date{align-self:center;background:rgba(98,128,66,.55);color:#fff;font-weight:600;font-size:14.5px;
  padding:5px 11px;border-radius:13px;margin-bottom:12px;letter-spacing:.1px}
.row{display:flex;padding:0 13px;margin-top:12px}
.row.cont{margin-top:5px}
.row.out{justify-content:flex-end}
.b{position:relative;max-width:430px;padding:11px 15px 11px 17px;border-radius:23px;font-size:24px;line-height:28px;
  font-weight:640;color:#000;letter-spacing:-.3px;word-wrap:break-word;box-sizing:border-box}
.out .b{background:var(--out);padding:11px 13px 11px 16px}
.in .b{background:var(--in)}
.b .sp{display:inline-block;height:1px}
.in .b .sp{width:53px}.out .b .sp{width:71px}
.b .tm{position:absolute;right:15px;bottom:7px;font-size:16.5px;font-weight:450;letter-spacing:.1px;
  display:flex;align-items:center;gap:3px;line-height:18px}
.in .b .tm{color:var(--in-time)}
.out .b .tm{color:var(--out-time);right:12px}
.tail{position:absolute;bottom:0;width:22px;height:22px;display:none}
.in .tail{left:-7px}
.out .tail{right:-7px;transform:scaleX(-1)}
.row.tailed .tail{display:block}
.in.tailed .b{border-bottom-left-radius:7px}
.out.tailed .b{border-bottom-right-radius:7px}
.in .tail path{fill:var(--in)} .out .tail path{fill:var(--out)}

#bar{position:absolute;left:0;right:0;bottom:0;background:#f6f6f7;border-top:.5px solid rgba(0,0,0,.14);z-index:4}
#field{position:absolute;left:66px;right:66px;top:10px;min-height:48px;background:#fff;border:1px solid #e2e2e6;
  border-radius:24px;box-sizing:border-box}
#txt{padding:10px 58px 9px 18px;font-size:24px;line-height:28px;font-weight:640;color:#000;letter-spacing:-.25px;
  word-wrap:break-word;min-height:26px}
#txt .ph{color:#b9b9be;font-weight:500}
#txt .bad{text-decoration:underline dotted #e5463d;text-decoration-thickness:2px;text-underline-offset:4px}
.cur{display:inline-block;width:2.5px;height:29px;background:var(--blue);vertical-align:-6px;margin:0 -1px;border-radius:1px}
.ic{position:absolute}
#clip{left:14px;bottom:15px}
#stk,#smile{right:12px;bottom:7px}
#mic{right:18px;bottom:15px}
#send{right:9px;bottom:13px}
</style>
</head>
<body>
<div id="title"></div>
<div id="screen">
  <div id="hdr"><div class="st"></div><div class="av"></div></div>
  <div id="chat">
    <div id="wall"></div>
    <svg id="doodles" width="100%" height="100%"></svg>
    <div id="list"></div>
  </div>
  <div id="bar">
    <svg class="ic" id="clip" width="38" height="38" viewBox="0 0 34 34"><path d="M22.5 10.5 12.6 20.4a3 3 0 0 0 4.2 4.2l11-11a5.6 5.6 0 0 0-7.9-7.9L8.6 17.1a8.2 8.2 0 0 0 11.6 11.6l8.4-8.4" fill="none" stroke="#88888d" stroke-width="2.3" stroke-linecap="round"/></svg>
    <div id="field">
      <div id="txt"></div>
      <svg class="ic" id="stk" width="33" height="33" viewBox="0 0 30 30"><path d="M26.5 15A11.5 11.5 0 1 1 15 3.5c0 6.4 5.1 11.5 11.5 11.5Z" fill="none" stroke="#8e8e93" stroke-width="2.1" stroke-linejoin="round"/><path d="M15 3.5A11.5 11.5 0 0 1 26.5 15" fill="none" stroke="#8e8e93" stroke-width="2.1"/></svg>
      <svg class="ic" id="smile" width="33" height="33" viewBox="0 0 30 30"><circle cx="15" cy="15" r="11.5" fill="none" stroke="#8e8e93" stroke-width="2.1"/><circle cx="11" cy="12.5" r="1.6" fill="#8e8e93"/><circle cx="19" cy="12.5" r="1.6" fill="#8e8e93"/><path d="M9.8 17.5c2.8 3.6 7.6 3.6 10.4 0" fill="none" stroke="#8e8e93" stroke-width="2.1" stroke-linecap="round"/></svg>
    </div>
    <svg class="ic" id="mic" width="29" height="38" viewBox="0 0 26 34"><rect x="8" y="2" width="10" height="19" rx="5" fill="none" stroke="#8e8e93" stroke-width="2.2"/><path d="M3.5 15.5a9.5 9.5 0 0 0 19 0M13 25v7" fill="none" stroke="#8e8e93" stroke-width="2.2" stroke-linecap="round"/></svg>
    <svg class="ic" id="send" width="47" height="47" viewBox="0 0 43 43"><circle cx="21.5" cy="21.5" r="21.5" fill="#3b8ef5"/><path d="M21.5 31V12.5M13.5 20l8-8 8 8" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="scene.js"></script>
<script>
const S = window.SCENE;
const $ = s => document.querySelector(s);
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(1 - p, 3);
const TAIL = '<svg class="tail" viewBox="0 0 22 22"><path d="M8 0V12.5C8 17 5.2 20.4 0 22 6.5 22.6 11.4 21 14.2 18.8 16.4 20.4 19 21.6 22 22V0Z"/></svg>';
const CHECK = '<svg width="15" height="11" viewBox="0 0 15 11"><path d="M1.5 6 5.2 9.6 13.5 1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// ---------- обои с дудлами (свои, нарисованы вручную) ----------
function buildDoodles() {
  const icons = {
    heart: '<path d="M15 26C5 18.5 2 13 5 8c3-5 8-3 10 1 2-4 7-6 10-1 3 5 0 10.5-10 18Z"/>',
    star: '<path d="M15 2.5 18.4 11l9.1.5-7.1 5.8 2.4 8.9L15 21.1l-7.8 5.1 2.4-8.9L2.5 11.5l9.1-.5Z"/>',
    cup: '<path d="M6 11h16v9a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6Z"/><path d="M22 13.5a3.8 3.8 0 0 1 0 7.5"/><path d="M11 3c2 2 0 3.5 0 5.5M16.5 3c2 2 0 3.5 0 5.5"/>',
    moon: '<path d="M19 3.5A11.5 11.5 0 1 0 26.5 20 9.5 9.5 0 0 1 19 3.5Z"/><path d="M24 6l.8 1.8L26.6 8l-1.8.8L24 10.6 23.2 8.8 21.4 8l1.8-.2Z"/>',
    cloud: '<path d="M8.5 23a5.5 5.5 0 0 1-.4-11 7.5 7.5 0 0 1 14.3-1.6A6.3 6.3 0 0 1 22 23Z"/>',
    note: '<path d="M11 22V7.5l13-3.5v15"/><ellipse cx="7.6" cy="22.3" rx="3.6" ry="2.8"/><ellipse cx="20.6" cy="19.3" rx="3.6" ry="2.8"/><path d="M11 11.5l13-3.5"/>',
    flower: '<circle cx="15" cy="13" r="3"/><path d="M15 10c-3-5 3-8 3-3M18 12c5-2 6 4 1 3M17 15.5c3 4.5-2 6.5-2.5 2M13 15.6c-2.5 4.5-7.5 1.5-3-1M12 12.2c-5-1.5-3-7 1.5-3.5"/><path d="M15 16v12M15 23c3-3 6-2 7-1"/>',
    balloon: '<ellipse cx="15" cy="11" rx="8" ry="9.5"/><path d="M15 20.5l-2 2.5h4ZM15 23c-3 3 2 4 -1 8"/><path d="M11 7.5a4 4 0 0 1 3-2.5"/>',
    paw: '<ellipse cx="15" cy="20" rx="6" ry="5"/><ellipse cx="7" cy="12.5" rx="2.4" ry="3"/><ellipse cx="12" cy="8" rx="2.4" ry="3"/><ellipse cx="18" cy="8" rx="2.4" ry="3"/><ellipse cx="23" cy="12.5" rx="2.4" ry="3"/>',
    leaf: '<path d="M5 25C5 11 14 4.5 26 4.5 26 16 19 25 5 25Z"/><path d="M5 25 19.5 11M12 18.5V13M15.5 15h5"/>',
    gift: '<rect x="5" y="12" width="20" height="14" rx="1.5"/><path d="M3.5 8.5h23v3.5h-23ZM15 8.5V26M15 8.5c-2-5-8-5-6-1 1 1.4 3.5 1 6 1Zm0 0c2-5 8-5 6-1-1 1.4-3.5 1-6 1Z"/>',
    sun: '<circle cx="15" cy="15" r="5.5"/><path d="M15 3v4M15 23v4M3 15h4M23 15h4M6.5 6.5l2.8 2.8M20.7 20.7l2.8 2.8M6.5 23.5l2.8-2.8M20.7 9.3l2.8-2.8"/>',
    mail: '<rect x="3.5" y="7" width="23" height="16" rx="2"/><path d="M4 8l11 8.5L26 8"/>',
    cat: '<path d="M6.5 13 7.5 4l5.5 5q2-.6 4 0L22.5 4l1 9c1.5 7-3 12-8.5 12S5 20 6.5 13Z"/><circle cx="11.3" cy="15" r=".9"/><circle cx="18.7" cy="15" r=".9"/><path d="M13.6 18.3 15 19.4l1.4-1.1M2 17.5l6 .6M2.5 21.5l5.8-1.4M28 17.5l-6 .6M27.5 21.5l-5.8-1.4"/>',
    cake: '<path d="M4 24h22V15L4 19.5ZM4 19.5V24M26 15 9 9.5 4 19.5"/><circle cx="12.5" cy="7.3" r="2.2"/><path d="M13.5 5.3c.6-1.8 2-2.6 3.6-2.6"/>',
    umbrella: '<path d="M3 15a12 12 0 0 1 24 0c-1.8-1.6-4.2-1.6-6 0-1.8-1.6-4.2-1.6-6 0-1.8-1.6-4.2-1.6-6 0-1.8-1.6-4.2-1.6-6 0Z"/><path d="M15 15v9.5a2.6 2.6 0 0 1-5.2 0"/>',
    swirl: '<path d="M15 15a2 2 0 1 1 2-2 4.5 4.5 0 0 1-4.5 4.5A6.5 6.5 0 0 1 6 11a8.5 8.5 0 0 1 8.5-8.5"/>',
    bell: '<path d="M8 21V14a7 7 0 0 1 14 0v7l2.5 3h-19Z"/><path d="M12.5 26.5a2.5 2.5 0 0 0 5 0M15 5V3"/>',
    teapot: '<path d="M7 13h14l-1 9a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3Z"/><path d="M21 15c3.5-1.5 5.5 1 3.5 3.5L21 21M7 15.5 3 13.5M11 13a3 3 0 0 1 6 0"/>',
    pin: '<path d="M15 27s8-8 8-14a8 8 0 0 0-16 0c0 6 8 14 8 14Z"/><circle cx="15" cy="13" r="3"/>',
  };
  const names = Object.keys(icons);
  // детерминированный «рандом»
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const W = 576, H = 760;
  let g = '';
  const step = 68;
  for (let y = -10, r = 0; y < H; y += step * 0.87, r++) {
    for (let x = (r % 2 ? step / 2 : 0) - 10; x < W; x += step) {
      const n = names[Math.floor(rnd() * names.length)];
      const jx = x + (rnd() - .5) * 18, jy = y + (rnd() - .5) * 14;
      const rot = (rnd() - .5) * 60, sc = 1.25 + rnd() * 0.4;
      g += `<g transform="translate(${jx.toFixed(1)} ${jy.toFixed(1)}) rotate(${rot.toFixed(1)} 15 15) scale(${sc.toFixed(2)})">${icons[n]}</g>`;
      if (rnd() < .55) {
        const dx = jx + 34 + rnd() * 10, dy = jy + 30 + rnd() * 8;
        g += rnd() < .5 ? `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="${(1.5 + rnd() * 2).toFixed(1)}"/>`
                        : `<path d="M${dx.toFixed(1)} ${(dy - 3).toFixed(1)}v6M${(dx - 3).toFixed(1)} ${dy.toFixed(1)}h6"/>`;
      }
    }
  }
  $('#doodles').innerHTML = `<g fill="none" stroke="rgba(52,100,44,.27)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${g}</g>`;
}

// ---------- сборка таймлайна ----------
const SEND_ANIM = 0.34, RECV_ANIM = 0.26;
const msgs = [];
S.initial.forEach(m => msgs.push({ ...m, t: -1 }));
S.incoming.forEach(m => msgs.push({ side: 'in', ...m }));
S.typing.forEach(ev => msgs.push({ side: 'out', text: ev.text, time: ev.time, t: ev.send, typed: true }));
msgs.sort((a, b) => a.t - b.t);

// клавиатурные состояния поля ввода: [[time, string], ...]
let seed2 = 42;
const rnd2 = () => (seed2 = (seed2 * 48271) % 2147483647) / 2147483647;
const keyStates = [];  // глобальный список {t, s}
function addPart(from, to, start, end) {
  // общая часть, затем стирание, затем набор
  let k = 0; while (k < from.length && k < to.length && from[k] === to[k]) k++;
  const ops = [];
  for (let i = from.length; i > k; i--) ops.push(from.slice(0, i - 1));
  for (let i = k + 1; i <= to.length; i++) ops.push(to.slice(0, i));
  const n = ops.length;
  // неравномерные интервалы
  const w = ops.map(() => 0.6 + rnd2() * 0.8);
  const tot = w.reduce((a, b) => a + b, 0);
  let acc = 0;
  ops.forEach((s, i) => { acc += w[i]; keyStates.push({ t: start + (end - start) * (acc - w[i] * 0.5) / tot, s }); });
}
S.typing.forEach(ev => {
  const parts = ev.parts || [{ from: '', to: ev.text, start: ev.start, end: ev.end }];
  parts.forEach(p => addPart(p.from, p.to, p.start, p.end));
  keyStates.push({ t: ev.send, s: '' });
});
keyStates.sort((a, b) => a.t - b.t);
window.KEYS = keyStates.map(k => k.t);  // для звука нажатий
window.MSGS = msgs.map(m => ({ t: m.t, side: m.side }));

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

function build() {
  $('#title').innerHTML = S.title.map(esc).join('<br>');
  $('#hdr .st').textContent = S.status;
  const list = $('#list');
  list.innerHTML = '<div class="date">Сегодня</div>';
  msgs.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'row ' + m.side;
    row.innerHTML = `<div class="b">${TAIL}<span class="tx">${esc(m.text)}</span><span class="sp"></span>` +
      `<span class="tm">${m.time}${m.side === 'out' ? CHECK : ''}</span></div>`;
    list.appendChild(row);
    m.el = row;
  });
  buildDoodles();
}

function inputAt(t) {
  let s = '';
  for (const k of keyStates) { if (k.t <= t) s = k.s; else break; }
  return s;
}
function lastKeyTime(t) {
  let lt = -10;
  for (const k of keyStates) { if (k.t <= t) lt = k.t; else break; }
  return lt;
}

window.render = function (t) {
  // --- поле ввода ---
  const s = inputAt(t);
  const focused = t < S.blur;
  const blinkOn = (t - lastKeyTime(t)) < 0.5 || Math.floor((t - lastKeyTime(t)) / 0.5) % 2 === 1;
  const cur = focused && blinkOn ? '<span class="cur"></span>' : '';
  let html;
  if (s) {
    html = esc(s).split(' ').map(w => S.misspelled.includes(w) ? `<span class="bad">${w}</span>` : w).join(' ') + cur;
  } else {
    html = cur + '<span class="ph">Сообщение</span>';
  }
  const txt = $('#txt');
  if (txt.innerHTML !== html) txt.innerHTML = html;
  $('#stk').style.display = s ? 'none' : '';
  $('#smile').style.display = s ? '' : 'none';
  $('#mic').style.display = s ? 'none' : '';
  $('#send').style.display = s ? '' : 'none';
  const fieldH = $('#field').offsetHeight;
  const barH = fieldH + 22;
  $('#bar').style.height = barH + 'px';
  const chat = $('#chat');
  chat.style.height = (543 - 13 - barH) + 'px';

  // --- сообщения ---
  const vis = msgs.filter(m => m.t <= t);
  msgs.forEach(m => { m.el.style.display = m.t <= t ? '' : 'none'; m.el.style.transform = ''; m.el.style.opacity = ''; });
  vis.forEach((m, i) => {
    const prev = vis[i - 1], next = vis[i + 1];
    m.el.classList.toggle('cont', !!prev && prev.side === m.side);
    m.el.classList.toggle('tailed', !next || next.side !== m.side);
  });
  const list = $('#list');
  list.style.transform = '';
  // смещение ленты: новые сообщения «въезжают» снизу
  let off = 0;
  const anim = [];
  vis.forEach((m, i) => {
    if (m.t < 0) return;
    const D = m.side === 'out' ? SEND_ANIM : RECV_ANIM;
    const p = (t - m.t) / D;
    if (p >= 1) return;
    const h = m.el.offsetHeight + parseFloat(getComputedStyle(m.el).marginTop);
    off += h * (1 - ease(p));
    anim.push({ m, p });
  });
  list.style.transform = off ? `translateY(${off.toFixed(2)}px)` : '';
  // исходящие «вылетают» из поля ввода
  anim.forEach(({ m, p }) => {
    if (m.side !== 'out') return;
    const e = ease(p);
    const chatRect = chat.getBoundingClientRect();
    const b = m.el.querySelector('.b');
    const r = b.getBoundingClientRect();
    // r уже включает текущее смещение ленты; вычтем его, чтобы получить конечную позицию
    const finalLeft = r.left, finalBottom = r.bottom - off;
    const startLeft = 68, startBottom = chatRect.bottom + 10 + 47;
    const curLeft = startLeft + (finalLeft - startLeft) * e;
    const curBottom = startBottom + (finalBottom - startBottom) * e;
    m.el.style.transform = `translate(${(curLeft - finalLeft).toFixed(2)}px, ${(curBottom - r.bottom).toFixed(2)}px)`;
    m.el.style.opacity = (0.35 + 0.65 * Math.min(1, p * 2.2)).toFixed(3);
  });
  return true;
};

build();
window.ready = document.fonts.ready.then(() => { render(0); return true; });
</script>
</body>
</html>
