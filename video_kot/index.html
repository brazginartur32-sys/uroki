<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Голосовое</title>
<style>
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;src:url(fonts/roboto-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;src:url(fonts/roboto-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root{
  --wall:#d3dde9; --out:#fff8df; --in:#fbfcfb; --ink:#141414;
  --out-time:#a8a596; --in-time:#a2a8ad; --check:#d2ac2f;
  --blue:#4489f2; --rec:#80a0fb; --red:#d8575d; --cancel:#6f87b5;
}
html,body{margin:0;width:576px;height:576px;background:#000;overflow:hidden;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;overflow:hidden;background:#000}
/* телефон рисуется шире и сжимается по горизонтали — как в референсе (кадр 9:19 втиснут в квадрат) */
#phone{position:absolute;left:0;top:0;width:678px;height:576px;transform-origin:0 0;background:var(--wall);overflow:hidden}
#chatwrap{position:absolute;left:0;top:0;width:678px;height:576px;transform-origin:62% 52%}
#list{position:absolute;left:0;right:0;bottom:130px;display:flex;flex-direction:column}
.row{display:flex;margin-top:16px;padding:0 13px}
.row.cont{margin-top:8px}
.row.out{justify-content:flex-end}
.b{position:relative;max-width:560px;box-sizing:border-box;padding:13px 16px 15px 21px;border-radius:30px;
  font-size:29px;line-height:34px;color:var(--ink);letter-spacing:.1px}
.out .b{background:var(--out)}
.in .b{background:var(--in)}
.b .sp{display:inline-block;height:1px;width:96px}
.out .b .sp{width:126px}
.b .tm{position:absolute;right:17px;bottom:11px;font-size:21px;line-height:24px;display:flex;align-items:center;gap:5px}
.in .b .tm{color:var(--in-time)}
.out .b .tm{color:var(--out-time)}
.tm svg{display:block}
.tail{position:absolute;bottom:0;width:20px;height:20px;display:none}
.in .tail{left:-8px}
.out .tail{right:-8px;transform:scaleX(-1)}
.row.tailed .tail{display:block}
.in.tailed .b{border-bottom-left-radius:8px}
.out.tailed .b{border-bottom-right-radius:8px}
.in .tail path{fill:var(--in)} .out .tail path{fill:var(--out)}
.stk{position:relative;width:392px;height:392px;margin-right:8px;margin-bottom:6px}
.stk img{width:100%;height:100%;display:block}
.stk .tm{position:absolute;right:30px;bottom:26px;background:rgba(60,50,45,.22);color:#fff;font-size:21px;line-height:24px;
  padding:4px 10px;border-radius:14px;display:flex;align-items:center;gap:5px}

#bar{position:absolute;left:5px;right:5px;top:466px;height:100px;background:#fcfcfc;border-radius:50px;overflow:hidden}
#bar .ic{position:absolute}
#lefticon{left:24px;top:30px}
#txt{position:absolute;left:84px;right:160px;top:31px;font-size:30px;line-height:38px;color:var(--ink);white-space:nowrap}
#txt .ph{color:#9b9b9b}
#txt u{text-decoration:none;border-bottom:2.5px solid #222;padding-bottom:1px}
.cur{display:inline-block;width:2.6px;height:36px;background:var(--blue);vertical-align:-8px;margin:0 -1px}
#clip{left:526px;top:31px}
#btn{position:absolute;left:597px;top:19px;width:62px;height:62px;border-radius:50%;background:var(--blue)}
#btn svg{position:absolute;inset:0}
/* запись голосового */
#recrow{position:absolute;inset:0;display:none}
#dot{position:absolute;left:41px;top:43px;width:15px;height:15px;border-radius:50%;background:var(--red)}
#trash{position:absolute;left:30px;top:30px}
#timer{position:absolute;left:84px;top:31px;font-size:28px;line-height:38px;color:#222;letter-spacing:.3px}
#slide{position:absolute;left:250px;top:32px;font-size:27px;line-height:38px;color:#8e8e8e}
#otm{position:absolute;left:280px;top:31px;font-size:28px;line-height:38px;color:var(--cancel);font-weight:500;letter-spacing:1px}
#otmhl{position:absolute;left:230px;top:-10px;width:250px;height:120px;border-radius:50%;background:#dbe5fb;opacity:0}
#bigc{position:absolute;left:561px;top:440px;width:156px;height:156px;border-radius:50%;background:var(--rec);transform-origin:50% 50%}
#bigc svg{position:absolute;left:0;top:0}
#lock{position:absolute;left:608px;top:283px;width:56px;height:94px;border-radius:28px;background:#f6f8f9;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#pause{position:absolute;left:608px;top:335px;width:56px;height:56px;border-radius:50%;background:#eef5f6;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#once{position:absolute;left:608px;top:238px;width:56px;height:56px;border-radius:50%;background:#eef5f6;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#tip{position:absolute;left:126px;top:328px;width:541px;box-sizing:border-box;padding:17px 22px 19px;background:rgba(52,56,64,.94);
  border-radius:14px;color:#fff;font-size:25px;line-height:36px;opacity:0}
#tip:after{content:'';position:absolute;right:30px;bottom:-12px;border:12px solid transparent;border-bottom:0;border-top-color:rgba(52,56,64,.94)}
#blurdefs{position:absolute;width:0;height:0}
</style>
</head>
<body>
<svg id="blurdefs"><filter id="mb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter></svg>
<div id="cam">
 <div id="phone">
  <div id="chatwrap"><div id="list"></div></div>
  <div id="bar">
    <div id="normrow">
      <svg class="ic" id="lefticon" width="42" height="42" viewBox="0 0 42 42"></svg>
      <div id="txt"></div>
      <svg class="ic" id="clip" width="40" height="40" viewBox="0 0 40 40"><path d="M26 11.5 14.6 23a3.5 3.5 0 0 0 5 5L31.5 16a6.4 6.4 0 0 0-9-9L10.4 19.1a9.3 9.3 0 0 0 13.2 13.2l9.2-9.2" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div id="btn"><svg width="62" height="62" viewBox="0 0 62 62"></svg></div>
    </div>
    <div id="recrow">
      <div id="otmhl"></div>
      <div id="dot"></div>
      <svg id="trash" width="40" height="42" viewBox="0 0 40 42"><g id="lid"><path d="M8 11h24M16 11V7.5h8V11" fill="none" stroke="#d8575d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M11 15h18l-1.6 20.5a3 3 0 0 1-3 2.7h-8.8a3 3 0 0 1-3-2.7Z" fill="#d8575d"/><path d="M17 20v12M23 20v12" stroke="#fbe3e4" stroke-width="2.2" stroke-linecap="round"/></svg>
      <div id="timer"></div>
      <div id="slide">‹ Влево — отмена</div>
      <div id="otm">ОТМЕНА</div>
    </div>
  </div>
  <div id="once"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="15" fill="none" stroke="#7c8185" stroke-width="2.6" stroke-dasharray="5 3.4"/><path d="M25.5 23.5 29 21.5V35" fill="none" stroke="#5f6468" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="pause"><svg width="56" height="56" viewBox="0 0 56 56"><rect x="20" y="18" width="5" height="20" rx="2" fill="#6d7276"/><rect x="31" y="18" width="5" height="20" rx="2" fill="#6d7276"/></svg></div>
  <div id="lock"><svg width="56" height="94" viewBox="0 0 56 94"><rect x="17" y="43" width="22" height="18" rx="3.5" fill="#7c8185"/><path d="M21 43v-6a7 7 0 0 1 14 0v6" fill="none" stroke="#7c8185" stroke-width="3"/><path d="M22 26l6-5 6 5" fill="none" stroke="#a5a9ad" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div id="bigc"><svg width="156" height="156" viewBox="-3 -3 150 150">
    <g id="bmic"><rect x="66" y="50" width="18" height="32" rx="9" fill="#fff"/><path d="M58 72a17 17 0 0 0 34 0M75 89v9" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
    <g id="bsend"><path d="M60 54 98 75 60 96 64 75Z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
  </svg></div>
  <div id="tip">Удерживайте для записи звука. Нажмите для переключения на видео.</div>
 </div>
</div>
<script src="scene.js"></script>
<script>
const S = window.SCENE, T = S.t;
const $ = s => document.querySelector(s);
const SX = 576 / 678;                       // горизонтальное «сжатие» кадра
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = p => { p = clamp(p); return 1 - Math.pow(1 - p, 3); };
const easeIO = p => { p = clamp(p); return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

const ICON = {
  smile: '<circle cx="21" cy="21" r="15" fill="none" stroke="#7d7d7d" stroke-width="2.6"/><circle cx="15.8" cy="17.5" r="2" fill="#7d7d7d"/><circle cx="26.2" cy="17.5" r="2" fill="#7d7d7d"/><path d="M14.5 24.5c3.6 4.4 9.4 4.4 13 0" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linecap="round"/>',
  sticker: '<path d="M8 13a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v9L23 35h-9a6 6 0 0 1-6-6Z" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linejoin="round"/><path d="M34 22h-6a5 5 0 0 0-5 5v8" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="17.5" r="2" fill="#7d7d7d"/><circle cx="25" cy="17.5" r="2" fill="#7d7d7d"/><path d="M15 23.5c1.8 2 4.6 2.6 7 1.6" fill="none" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round"/>',
  trash: '<g transform="translate(1 0)"><path d="M8 11h24M16 11V7.5h8V11" fill="none" stroke="#d8575d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 15h18l-1.6 20.5a3 3 0 0 1-3 2.7h-8.8a3 3 0 0 1-3-2.7Z" fill="#d8575d"/></g>',
  send: '<path d="M17 30.5 44 19 36 44l-6.5-9.5Zm12.5 4L44 19" fill="#fff" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>',
  mic: '<rect x="25" y="15" width="12" height="21" rx="6" fill="#fff"/><path d="M19.5 30a11.5 11.5 0 0 0 23 0M31 42v5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>',
  cam: '<rect x="17" y="17" width="28" height="28" rx="9" fill="none" stroke="#fff" stroke-width="3.2"/><circle cx="31" cy="31" r="6" fill="none" stroke="#fff" stroke-width="3.2"/>',
};
const TAIL = '<svg class="tail" viewBox="0 0 20 20"><path d="M8 0V10C8 14.5 5 18 0 20H14C16 20 18 20 20 20V0Z"/></svg>';
const CHECK2 = c => `<svg width="30" height="16" viewBox="0 0 30 16"><path d="M2 8.5 6.5 13 15.5 3M12 13 21.5 3" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHECK1 = c => `<svg width="30" height="16" viewBox="0 0 30 16"><path d="M8 8.5 12.5 13 21.5 3" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CLOCK = c => `<svg width="30" height="16" viewBox="0 0 30 16"><circle cx="15" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="2"/><path d="M15 4.5V8l2.5 1.6" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;

// ---------- сообщения ----------
const M6final = typeof S.M6 === 'string' ? S.M6 : S.M6.final;
const msgs = [
  { side: 'out', sticker: true, time: S.timeA, t: -1 },
  { side: 'out', text: S.M1, time: S.timeA, t: -1 },
  { side: 'out', text: S.M2, time: S.timeA, t: T.m2Send, status: 'pending' },
  { side: 'in', text: S.M3, time: S.timeB, t: T.m3 },
  { side: 'in', text: S.M4, time: S.timeB, t: T.m4 },
  { side: 'out', text: S.M5, time: S.timeB, t: T.m5Send },
  { side: 'out', text: M6final, time: S.timeB, t: T.m6Send },
  { side: 'in', text: S.M7, time: S.timeB, t: T.m7 },
  { side: 'in', text: S.M8, time: S.timeB, t: T.m8 },
];
window.MSGS = msgs.map(m => ({ t: m.t, side: m.side }));
const PUNCH = [T.m2Send, T.m3, T.m4, T.m5Send, T.m6Send, T.m7, T.m8];

function build() {
  const list = $('#list');
  msgs.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row ' + m.side;
    if (m.sticker) {
      row.innerHTML = `<div class="stk"><img src="sticker.svg"><span class="tm">${m.time}${CHECK2('#fff')}</span></div>`;
    } else {
      row.innerHTML = `<div class="b">${TAIL}<span class="tx">${esc(m.text)}</span><span class="sp"></span><span class="tm"><span>${m.time}</span><span class="st"></span></span></div>`;
    }
    list.appendChild(row);
    m.el = row;
  });
}

// ---------- набор текста ----------
let seed = 9;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function typeSeq(text, a, b, from = '') {
  const out = [];
  const n = text.length - from.length;
  const w = Array.from({ length: n }, () => .6 + rnd() * .8), tot = w.reduce((x, y) => x + y, 0);
  let acc = 0;
  for (let i = 0; i < n; i++) { acc += w[i]; out.push({ t: a + (b - a) * acc / tot, s: text.slice(0, from.length + i + 1) }); }
  return out;
}
const KEYS = [];
KEYS.push(...typeSeq(S.M2, T.m2Type[0], T.m2Type[1]));
KEYS.push({ t: T.m2Send, s: '', send: true });
KEYS.push(...typeSeq(S.M5, T.m5Type[0], T.m5Type[1]));
KEYS.push({ t: T.m5Send, s: '', send: true });
if (typeof S.M6 === 'string') {
  KEYS.push(...typeSeq(S.M6, T.m6Type[0], T.m6Type[1]));
} else {
  // шаги: набор (type) и автозамена клавиатурой (set); время делится по числу нажатий
  const [a, b] = T.m6Type;
  let cur = '', cost = 0;
  const plan = S.M6.steps.map(st => { const c = st.type ? st.type.length - (st.type.startsWith(cur) ? cur.length : 0) : 3; cur = st.type || st.set; cost += c; return { ...st, c }; });
  let tt = a; cur = '';
  for (const st of plan) {
    const dt = (b - a) * st.c / cost;
    if (st.type) { const from = st.type.startsWith(cur) ? cur : ''; KEYS.push(...typeSeq(st.type, tt, tt + dt, from)); cur = st.type; }
    else { KEYS.push({ t: tt + dt * 0.7, s: st.set, fix: true }); cur = st.set; }
    tt += dt;
  }
}
KEYS.push({ t: T.m6Send, s: '', send: true });
KEYS.sort((x, y) => x.t - y.t);
window.KEYS = KEYS.map(k => ({ t: k.t, send: !!k.send, fix: !!k.fix }));

function inputAt(t) { let s = '', last = -9; for (const k of KEYS) { if (k.t <= t) { s = k.s; last = k.t; } else break; } return { s, last }; }

// ---------- кадр ----------
let lastTxt = null;
window.render = function (t) {
  // --- поле ввода / запись ---
  const recOn = t >= T.rec && t < T.recGone;
  const { s, last } = inputAt(t);
  $('#recrow').style.display = recOn ? 'block' : 'none';
  $('#normrow').style.display = recOn ? 'none' : '';
  if (!recOn) {
    // курсор мигает, пока поле в фокусе
    const blink = (t - last) < .45 || Math.floor((t - last) / .45) % 2 === 1;
    const cur = blink ? '<span class="cur"></span>' : '';
    let html;
    if (s) {
      // подчёркнуто слово, которое сейчас набирается (как в клавиатуре Android)
      const i = s.lastIndexOf(' ') + 1, w = s.slice(i);
      const composing = (t - last) < 0.6 && !/[?!]$/.test(s);
      html = esc(s.slice(0, i)) + (composing && w ? `<u>${esc(w)}</u>` : esc(w)) + cur;
    } else {
      html = cur + '<span class="ph">Сообщение</span>';
    }
    if (html !== lastTxt) { $('#txt').innerHTML = html; lastTxt = html; }
    // левая иконка
    let left = s ? 'smile' : 'sticker';
    if (t >= T.recGone && t < T.m5Type[0] + 0.12) left = 'trash';
    const li = $('#lefticon');
    if (li.dataset.k !== left) { li.innerHTML = ICON[left]; li.dataset.k = left; }
    $('#clip').style.display = s ? 'none' : '';
    // правая кнопка: отправка / камера / микрофон
    let bk = s ? 'send' : (t >= T.m2Send && t < T.tooltip[0] ? 'cam' : 'mic');
    const bs = $('#btn svg');
    if (bs.dataset.k !== bk) { bs.innerHTML = ICON[bk]; bs.dataset.k = bk; }
    // кнопка «нажимается»
    const press = t >= T.tooltip[0] - .08 && t < T.tooltip[0] + .05 ? .9 : 1;
    $('#btn').style.transform = `scale(${press})`;
  } else {
    const stopAt = T.recCancel - 0.13 + 1e-4;
    const rt = Math.max(0, (Math.min(t, stopAt) - T.rec) * T.recSpeed);
    const tt = `0:${String(Math.floor(rt)).padStart(2, '0')},${Math.floor(rt * 10) % 10}`;
    $('#timer').textContent = tt;
    const canceled = t >= T.recCancel;
    $('#dot').style.display = canceled ? 'none' : '';
    $('#dot').style.opacity = (0.5 + 0.5 * Math.cos(2 * Math.PI * (t - T.rec) / 0.55)).toFixed(3);
    $('#trash').style.display = canceled ? '' : 'none';
    const lidA = canceled ? Math.sin(clamp((t - T.recCancel) / .25) * Math.PI) * -28 : 0;
    $('#lid').setAttribute('transform', `rotate(${lidA.toFixed(1)} 8 11)`);
    const lk = clamp((t - T.recLock) / 0.2);
    $('#slide').style.opacity = (1 - lk).toFixed(3);
    $('#slide').style.transform = `translateX(${(-lk * 30).toFixed(1)}px)`;
    const otmA = canceled ? 1 - clamp((t - T.recCancel - .12) / .18) : lk;
    $('#otm').style.opacity = otmA.toFixed(3);
    $('#otmhl').style.opacity = canceled ? (Math.sin(clamp((t - T.recCancel) / .3) * Math.PI) * .9).toFixed(3) : 0;
  }
  // большой круг записи, замок, пауза, «один раз»
  const appear = ease((t - T.rec) / 0.16);
  const gone = canceledK(t);
  const bigS = recOn ? appear * (1 - gone) : 0;
  const bc = $('#bigc');
  bc.style.display = bigS > 0.01 ? '' : 'none';
  bc.style.transform = `scale(${bigS.toFixed(3)})`;
  const lk = clamp((t - T.recLock) / 0.2);
  $('#bmic').style.opacity = (1 - lk).toFixed(3);
  $('#bsend').style.opacity = lk.toFixed(3);
  const lockA = recOn ? ease((t - T.rec - .12) / .15) * (1 - lk) : 0;
  $('#lock').style.display = lockA > 0.01 ? '' : 'none';
  $('#lock').style.opacity = lockA.toFixed(3);
  $('#lock').style.transform = `translateY(${(-lk * 40 + (1 - ease((t - T.rec - .12) / .15)) * 30).toFixed(1)}px)`;
  const pA = recOn ? ease((t - T.recLock - .05) / .2) * (1 - gone) : 0;
  for (const id of ['#pause', '#once']) {
    $(id).style.display = pA > 0.01 ? '' : 'none';
    $(id).style.opacity = pA.toFixed(3);
    $(id).style.transform = `scale(${(0.6 + 0.4 * pA).toFixed(3)})`;
  }
  // подсказка
  const tipA = clamp((t - T.tooltip[0]) / .08) * (1 - clamp((t - T.tooltip[1]) / .12));
  $('#tip').style.opacity = tipA.toFixed(3);

  // --- лента ---
  const vis = msgs.filter(m => m.t <= t);
  msgs.forEach(m => { m.el.style.display = m.t <= t ? '' : 'none'; });
  vis.forEach((m, i) => {
    const prev = vis[i - 1], next = vis[i + 1];
    m.el.classList.toggle('cont', !!prev && prev.side === m.side);
    m.el.classList.toggle('tailed', !m.sticker && (!next || next.side !== m.side));
    if (m.side === 'out' && !m.sticker) {
      let st = 'read';
      if (m.status === 'pending') st = t < T.m2Delivered ? 'pending' : t < T.m2Read ? 'sent' : 'read';
      const html = st === 'pending' ? CLOCK('#a8a596') : st === 'sent' ? CHECK1('#a8a596') : CHECK2('#d2ac2f');
      const el = m.el.querySelector('.st');
      if (el.dataset.k !== st) { el.innerHTML = html; el.dataset.k = st; }
    }
  });
  // сдвиг ленты: новое сообщение «въезжает» снизу
  const list = $('#list');
  list.style.transform = '';
  let off = 0;
  vis.forEach(m => {
    if (m.t < 0) return;
    const p = (t - m.t) / 0.2;
    if (p >= 1) return;
    off += (m.el.offsetHeight + parseFloat(getComputedStyle(m.el).marginTop)) * (1 - ease(p));
  });
  list.style.transform = off ? `translateY(${off.toFixed(2)}px)` : '';

  // --- «рывок» на каждое сообщение: зум + смаз только области чата ---
  let a = 0;
  for (const e of PUNCH) {
    const d = t - e;
    if (d < 0 || d > 0.32) continue;
    a = Math.max(a, d < 0.08 ? d / 0.08 : 1 - (d - 0.08) / 0.24);
  }
  a = clamp(a);
  const cw = $('#chatwrap');
  cw.style.transform = a ? `scale(${(1 + 0.11 * a).toFixed(4)})` : '';
  $('#mbg').setAttribute('stdDeviation', `${(9 * a).toFixed(2)} ${(4 * a).toFixed(2)}`);
  cw.style.filter = a > 0.01 ? 'url(#mb)' : '';

  // --- камера: финальный наезд на два последних сообщения ---
  const ph = $('#phone');
  let z = 1, tx = 0, ty = 0;
  if (t >= T.zoom) {
    const m7 = msgs[7].el.querySelector('.b'), m8 = msgs[8].el.querySelector('.b');
    // позиция в координатах телефона (без трансформаций камеры)
    ph.style.transform = `scaleX(${SX})`;
    const pr = ph.getBoundingClientRect();
    const r7 = m7.getBoundingClientRect(), r8 = m8.getBoundingClientRect();
    const toP = (x, y) => ({ x: (x - pr.left) / SX, y: y - pr.top });
    const L = toP(Math.min(r7.left, r8.left), r7.top), R = toP(Math.max(r7.right, r8.right), r8.bottom);
    const P = { x: L.x + (R.x - L.x) * 0.42, y: (L.y + R.y) / 2 };
    const S0 = { x: P.x * SX, y: P.y };
    let Z, F;
    if (t < T.glitch) {
      const k = easeIO((t - T.zoom) / (T.glitch - T.zoom));
      Z = 1 + 0.5 * k; F = { x: lerp(S0.x, 250, k), y: lerp(S0.y, 330, k) };
    } else {
      // во время глитча — рывками крупнее, с дрожанием
      const step = Math.floor((t - T.glitch) / 0.05);
      const big = t >= T.glitch + 0.4;
      const j = ((step * 7919) % 13) / 13 - 0.5;
      Z = big ? 2.2 + 0.08 * j : 1.62 + 0.04 * j;
      F = { x: (big ? 262 : 255) + 14 * j, y: (big ? 300 : 320) + 8 * j };
    }
    z = Z; tx = F.x - P.x * SX * Z; ty = F.y - P.y * Z;
    // камера не выходит за край экрана телефона
    tx = clamp(tx, 576 - 678 * SX * z, 0); ty = clamp(ty, 576 - 576 * z, 0);
  }
  ph.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${(z * SX).toFixed(5)}, ${z.toFixed(5)})`;
  return true;
};
function canceledK(t) { return clamp((t - T.recCancel) / 0.27); }

build();
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))])
  .then(() => { render(0); return true; });
</script>
</body>
