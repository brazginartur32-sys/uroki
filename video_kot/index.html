<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Голосовое</title>
<style>
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;src:url(fonts/roboto-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;src:url(fonts/roboto-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root{
  --wall:#d3dde9; --out:#fff8df; --in:#fbfcfb; --ink:#2f3440;
  --out-time:#bdb69a; --in-time:#b3b6b6; --check:#d2ac2f;
  --blue:#4a7af7; --rec:#7f9ffa; --red:#c65a55; --cancel:#6c86c0;
}
html,body{margin:0;width:576px;height:576px;background:#000;overflow:hidden;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;overflow:hidden;background:#000}
/* экран телефона рисуется шириной 764 и сжимается до 576 — как в референсе (вертикальная запись втиснута в квадрат) */
#phone{position:absolute;left:0;top:0;width:764px;height:576px;transform-origin:0 0;background:var(--wall);overflow:hidden}
#chatwrap{position:absolute;left:0;top:0;width:764px;height:576px}
#list{position:absolute;left:0;right:0;bottom:131px;display:flex;flex-direction:column}
.row{display:flex;margin-top:16px;padding:0 17px 0 9px}
.row.cont{margin-top:4px}
.row.out{justify-content:flex-end}
.b{position:relative;max-width:640px;box-sizing:border-box;padding:13px 25px 15px 24px;border-radius:19px;
  font-size:32px;line-height:37px;color:var(--ink);letter-spacing:.1px}
.out .b{background:var(--out);padding-right:13px}
.in .b{background:var(--in)}
.in:not(.tailed) .b{border-bottom-left-radius:6px} .in.cont .b{border-top-left-radius:6px}
.out:not(.tailed) .b{border-bottom-right-radius:6px} .out.cont .b{border-top-right-radius:6px}
.b .sp{display:inline-block;height:1px}
.b .tm{position:absolute;right:25px;bottom:11px;font-size:25px;line-height:28px;display:flex;align-items:center;gap:4px}
.out .b .tm{right:13px}
.in .b .tm{color:var(--in-time)}
.out .b .tm{color:var(--out-time)}
.tm svg{display:block}
.tail{position:absolute;bottom:0;width:20px;height:20px;display:none}
.in .tail{left:-8px}
.out .tail{right:-8px;transform:scaleX(-1)}
.row.tailed .tail{display:block}
.in.tailed .b{border-bottom-left-radius:7px}
.out.tailed .b{border-bottom-right-radius:7px}
.in .tail path{fill:var(--in)} .out .tail path{fill:var(--out)}
.stk{position:relative;width:396px;height:396px;margin-right:6px;margin-bottom:4px}
.stk img{width:100%;height:100%;display:block}
.stk .tm{position:absolute;right:13px;bottom:35px;background:rgba(60,50,45,.22);color:#fff;font-size:25px;line-height:28px;
  padding:1px 12px;border-radius:16px;display:flex;align-items:center;gap:4px}

#bar{position:absolute;left:5px;right:5px;top:466px;height:100px;background:#fcfcfc;border-radius:50px;overflow:hidden}
#normrow,#recrow{position:absolute;inset:0}
.ic{position:absolute}
#lefticon{left:13px;top:22px}
#txtwrap{position:absolute;left:94px;right:190px;top:28px;height:44px}
#txt{font-size:36px;line-height:44px;color:var(--ink);white-space:nowrap}
#txt .ph{color:#9d9d9d}
#txt u{text-decoration:none;border-bottom:3px solid #2a2a2a;padding-bottom:0}
.cur{display:inline-block;width:3px;height:46px;background:#6a6c78;vertical-align:-11px;margin:0 -1px}
.cur.idle{background:var(--blue)}
#clip{left:588px;top:21px}
#btn{position:absolute;left:672px;top:19.5px;width:74px;height:74px;border-radius:50%;background:var(--blue)}
#btn svg{position:absolute;inset:0}
/* запись голосового */
#dot{position:absolute;left:42px;top:32.5px;width:18px;height:18px;border-radius:50%;background:#c4553f}
#trash{position:absolute;left:28px;top:18px;overflow:visible;transform-origin:50% 60%}
#timer{position:absolute;left:90px;top:24px;font-size:30px;line-height:40px;color:#8e8e93;letter-spacing:.3px;white-space:nowrap}
#timer .roll{display:inline-block;position:relative;overflow:hidden;vertical-align:top;height:40px}
#timer .roll span{display:block}
#slide{position:absolute;left:278px;top:28px;font-size:30px;line-height:40px;color:#8e8e8e;white-space:nowrap}
#slide svg{display:inline-block;vertical-align:-3px;margin-right:24px}
#slide .dash{margin:0 12px}
#otm{position:absolute;left:276px;width:200px;text-align:center;top:25.5px;font-size:29px;line-height:34px;color:var(--cancel);font-weight:400;letter-spacing:1px}
#otmhl{position:absolute;left:218px;top:0;width:304px;height:100%;border-radius:10px;opacity:0;
  background:linear-gradient(90deg,rgba(218,226,248,0) 0,#dae2f8 33px,#dae2f8 100%)}
#bigc{position:absolute;left:634px;top:440px;width:176px;height:176px;border-radius:50%;background:var(--rec);transform-origin:50% 50%}
#bigc svg{position:absolute;left:0;top:0}
.pill{position:absolute;background:#f1f6f7;box-shadow:0 1px 4px rgba(0,0,0,.08)}
#lock{left:688px;top:285px;width:60px;height:90px;border-radius:30px}
#once{left:681px;top:231px;width:68px;height:68px;border-radius:50%}
#pause{left:681px;top:328px;width:68px;height:68px;border-radius:50%}
#tip{position:absolute;left:143px;top:327px;width:607px;height:129px;box-sizing:border-box;padding:17px 24px 0;background:rgba(52,54,76,.95);
  border-radius:14px;color:#fff;font-size:28px;line-height:47px;opacity:0}
#tip:after{content:'';position:absolute;right:27px;bottom:-10px;border:12px solid transparent;border-bottom:0;border-top:10px solid rgba(52,54,76,.95)}
#defs{position:absolute;width:0;height:0}
</style>
</head>
<body>
<svg id="defs">
  <filter id="vb" x="-2%" y="-10%" width="104%" height="120%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter>
  <filter id="hb" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur id="hbg" stdDeviation="0 0"/></filter>
  <filter id="bb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="bbg" stdDeviation="0 0"/></filter>
  <filter id="pb" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur id="pbg" stdDeviation="0 0"/></filter>
</svg>
<div id="cam">
 <div id="phone">
  <div id="chatwrap"><div id="list"></div></div>
  <div id="bar">
    <div id="normrow">
      <svg class="ic" id="lefticon" width="64" height="64" viewBox="0 0 42 42"></svg>
      <div id="txtwrap"><div id="txt"></div></div>
      <svg class="ic" id="clip" width="66" height="66" viewBox="0 0 40 40"><path d="M26 11.5 14.6 23a3.5 3.5 0 0 0 5 5L31.5 16a6.4 6.4 0 0 0-9-9L10.4 19.1a9.3 9.3 0 0 0 13.2 13.2l9.2-9.2" fill="none" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div id="btn"><svg width="74" height="74" viewBox="0 0 62 62"></svg></div>
    </div>
    <div id="recrow">
      <div id="otmhl"></div>
      <div id="dot"></div>
      <div id="timer"></div>
      <div id="slide"><svg width="11" height="22" viewBox="0 0 11 22"><path d="M9.5 1 2 11l7.5 10" fill="none" stroke="#8e8e8e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Влево<span class="dash">—</span>отмена</div>
      <div id="otm">ОТМЕНА</div>
    </div>
    <svg id="trash" width="45" height="48" viewBox="0 0 45 48">
      <path id="tlid" d="M3.5 9.5h38M16.5 9.5V4.5h12v5" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="tbody" d="M6 14h33v26.5a5.5 5.5 0 0 1-5.5 5.5h-22A5.5 5.5 0 0 1 6 40.5Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      <path id="tstripes" d="M15 20v19M22.5 20v19M30 20v19" stroke="#fbe6e6" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="once" class="pill"><svg width="68" height="68" viewBox="0 0 68 68"><g id="onceIcon"><path d="M34 13A21 21 0 0 0 34 55" fill="none" stroke="#7c8185" stroke-width="3.4" stroke-linecap="round"/><path d="M34 13A21 21 0 0 1 34 55" fill="none" stroke="#7c8185" stroke-width="3.4" stroke-dasharray="6 4.6"/><path d="M31 28.5 35 26V43" fill="none" stroke="#5f6468" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="lockIcon"><rect x="21" y="32" width="26" height="20" rx="4.5" fill="#6f7478"/><path d="M26 32v-5a8 8 0 0 1 16 0v5" fill="none" stroke="#6f7478" stroke-width="3.6"/><circle cx="34" cy="41.5" r="2.8" fill="#fff"/></g></svg></div>
  <div id="pause" class="pill"><svg width="68" height="68" viewBox="0 0 68 68"><rect x="22" y="22" width="8" height="24" rx="2.5" fill="#7d7e8a"/><rect x="38" y="22" width="8" height="24" rx="2.5" fill="#7d7e8a"/></svg></div>
  <div id="lock" class="pill"><svg width="60" height="90" viewBox="0 0 60 90"><rect x="15" y="44" width="30" height="24" rx="5" fill="#6f7478"/><path id="shackle" d="M20.5 44v-7a9.5 9.5 0 0 1 19 0v7" fill="none" stroke="#6f7478" stroke-width="4"/><circle cx="30" cy="55.5" r="3.2" fill="#fff"/></svg></div>
  <div id="bigc"><svg width="176" height="176" viewBox="0 0 176 176">
    <g id="bmic"><rect x="74" y="62" width="12" height="24" rx="6" fill="none" stroke="#fff" stroke-width="3"/><path d="M68 78a12 12 0 0 0 24 0M80 90v8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
    <g id="bsend"><path d="M64 62 108 80 64 98 71 80Z" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M71 80H90" stroke="#7f9ffa" stroke-width="2.4" stroke-linecap="round"/></g>
  </svg></div>
  <div id="tip">Удерживайте для записи звука. Нажмите для переключения на видео.</div>
 </div>
</div>
<script src="scene.js"></script>
<script>
const S = window.SCENE, T = S.t;
const $ = s => document.querySelector(s);
const SX = 576 / 764;                       // горизонтальное «сжатие» кадра
const FR = 1 / 30;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = p => { p = clamp(p); return 1 - Math.pow(1 - p, 3); };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fnum = x => x.toFixed(3);

const ICON = {
  smile: '<circle cx="21" cy="21" r="15" fill="none" stroke="#7d7d7d" stroke-width="2.6"/><circle cx="15.8" cy="17.5" r="2" fill="#7d7d7d"/><circle cx="26.2" cy="17.5" r="2" fill="#7d7d7d"/><path d="M14.5 24.5c3.6 4.4 9.4 4.4 13 0" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linecap="round"/>',
  sticker: '<path d="M8 13a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v9L23 35h-9a6 6 0 0 1-6-6Z" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linejoin="round"/><path d="M34 22h-6a5 5 0 0 0-5 5v8" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="17.5" r="2" fill="#7d7d7d"/><circle cx="25" cy="17.5" r="2" fill="#7d7d7d"/><path d="M15 23.5c1.8 2 4.6 2.6 7 1.6" fill="none" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round"/>',
  trash: '<g transform="translate(1 -1)"><path d="M8 11h24M16 11V7.5h8V11" fill="none" stroke="#c65a55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 15h18l-1.6 20.5a3 3 0 0 1-3 2.7h-8.8a3 3 0 0 1-3-2.7Z" fill="#c65a55"/><path d="M15.8 20v12M20 20v12M24.2 20v12" stroke="#fbe6e6" stroke-width="1.8" stroke-linecap="round"/></g>',
  send: '<path d="M16 30.5 45 18.5 37 45l-7-10Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M30 35 45 18.5" stroke="#4a7af7" stroke-width="2"/>',
  mic: '<rect x="26" y="15" width="10" height="20" rx="5" fill="#fff"/><path d="M20.5 29a10.5 10.5 0 0 0 21 0M31 40v5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>',
  cam: '<rect x="18" y="18" width="26" height="26" rx="8" fill="#fff"/><circle cx="31" cy="31" r="6.2" fill="none" stroke="#4a7af7" stroke-width="3"/>',
};
const TAIL = '<svg class="tail" viewBox="0 0 20 20"><path d="M8 0V10C8 14.5 5 18 0 20H14C16 20 18 20 20 20V0Z"/></svg>';
const CHECK2 = c => `<svg width="30" height="22" viewBox="1 0 21 16"><path d="M2 8.5 6.5 13 15.5 3M12 13 21.5 3" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHECK1 = c => `<svg width="30" height="22" viewBox="1 0 21 16"><path d="M5 8.5 9.5 13 18.5 3" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CLOCK = c => `<svg width="30" height="22" viewBox="1 0 21 16"><circle cx="12" cy="8" r="6.5" fill="none" stroke="${c}" stroke-width="2"/><path d="M12 4.5V8l2.5 1.6" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/></svg>`;

// ---------- сообщения ----------
const M6final = typeof S.M6 === 'string' ? S.M6 : S.M6.final;
const msgs = [
  { side: 'out', sticker: true, time: S.timeA, t: -1 },
  { side: 'out', text: S.M1, time: S.timeA, t: -1 },
  { side: 'out', text: S.M2, time: S.timeA, t: T.m2Send, status: 'pending' },
  { side: 'in', text: S.M3, time: S.timeB, t: T.m3 },
  { side: 'in', text: S.M4, time: S.timeB, t: T.m4 },
  { side: 'out', text: S.M5, time: S.timeB, t: T.m5Send },
  { side: 'out', text: M6final, time: S.timeB, t: T.m6Send },
  { side: 'in', text: S.M7, time: S.timeB, t: T.m7 },
  { side: 'in', text: S.M8, time: S.timeB, t: T.m8 },
];
window.MSGS = msgs.map(m => ({ t: m.t, side: m.side }));
const EVENTS = msgs.filter(m => m.t > 0).map(m => m.t);
const SENDS = [T.m2Send, T.m5Send, T.m6Send];

function build() {
  const list = $('#list');
  msgs.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row ' + m.side;
    if (m.sticker) {
      row.innerHTML = `<div class="stk"><img src="sticker.svg"><span class="tm">${m.time}${CHECK2('#fff')}</span></div>`;
    } else {
      row.innerHTML = `<div class="b">${TAIL}<span class="tx">${esc(m.text)}</span><span class="sp"></span><span class="tm"><span>${m.time}</span><span class="st">${m.side === 'out' ? CHECK2('#e0c87d') : ''}</span></span></div>`;
    }
    list.appendChild(row);
    m.el = row;
  });
}
function sizeSpacers() {
  // место под время: ширина метки + ~20px телефона (≈15px в кадре), как в референсе
  msgs.forEach(m => {
    if (m.sticker) return;
    m.el.style.display = '';
    const tm = m.el.querySelector('.tm');
    m.el.querySelector('.sp').style.width = (tm.offsetWidth + 20) + 'px';
  });
}

// ---------- набор текста ----------
let seed = 9;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function typeSeq(text, a, b, from = '') {
  const out = [];
  const n = text.length - from.length;
  const w = Array.from({ length: n }, () => .6 + rnd() * .8), tot = w.reduce((x, y) => x + y, 0);
  let acc = 0;
  for (let i = 0; i < n; i++) { acc += w[i]; out.push({ t: a + (b - a) * acc / tot, s: text.slice(0, from.length + i + 1) }); }
  return out;
}
const KEYS = [];
KEYS.push(...typeSeq(S.M2, T.m2Type[0], T.m2Type[1]));
KEYS.push({ t: T.m2Send, s: '', send: true });
KEYS.push(...typeSeq(S.M5, T.m5Type[0], T.m5Type[1]));
KEYS.push({ t: T.m5Send, s: '', send: true });
if (typeof S.M6 === 'string') {
  KEYS.push(...typeSeq(S.M6, T.m6Type[0], T.m6Type[1]));
} else {
  KEYS.push(...typeSeq(S.M6.typo, T.m6Type[0], T.m6Type[1]));
  KEYS.push({ t: T.m6Fix, s: S.M6.final, fix: true });
}
KEYS.push({ t: T.m6Send, s: '', send: true });
KEYS.sort((x, y) => x.t - y.t);
window.KEYS = KEYS.map(k => ({ t: k.t, send: !!k.send, fix: !!k.fix }));
const TYPE_END = [T.m2Type[1], T.m5Type[1]];

function inputAt(t) {
  let s = '', last = -9, fix = false;
  for (const k of KEYS) { if (k.t <= t) { s = k.s; last = k.t; fix = !!k.fix; } else break; }
  return { s, last, fix };
}

// профиль «рывка»: только вертикальный смаз, по кадрам от события (как у референса)
const PUNCH_PROFILE = [2.6, 4.2, 3.6, 3.0, 2.4, 1.6, 1.0, 0.4];
// остаток пути прокрутки по кадрам от события: 2 кадра «тянется», затем быстрый ease-out
const REMAIN = [0.9, 0.9, 0.5, 0.3, 0.16, 0.09, 0.05, 0.03];
function punchAt(t) {
  let v = 0;
  for (const e of EVENTS) {
    const n = Math.floor((t - e) / FR + 1e-6);
    if (n >= 0 && n < PUNCH_PROFILE.length) v = Math.max(v, PUNCH_PROFILE[n]);
  }
  return v;
}

// кривая финального наезда (замер масштаба референса по кадрам)
const ZK = [[18.15, 1.0], [18.2, 1.01], [18.5, 1.10], [18.73, 1.20], [19.0, 1.35], [19.2, 1.48], [19.4, 1.64], [19.6, 1.85], [19.8, 2.0], [20.0, 2.2], [20.3, 2.42]];
function zoomAt(t) {
  if (t <= ZK[0][0]) return 1;
  for (let i = 1; i < ZK.length; i++) if (t <= ZK[i][0]) {
    const [a, za] = ZK[i - 1], [b, zb] = ZK[i];
    return za + (zb - za) * (t - a) / (b - a);
  }
  return ZK[ZK.length - 1][1];
}

function setBlur(id, x, y) { $(id).setAttribute('stdDeviation', `${x.toFixed(2)} ${y.toFixed(2)}`); }

let lastTxt = null;
window.render = function (t) {
  // ================= поле ввода / запись =================
  const inCross = t >= T.recFade && t < T.rec;                          // 2.10→2.20 кроссфейд
  const crossIn = clamp((t - T.recFade) / (T.rec - T.recFade));
  const recVis = t >= T.recFade && t < T.recGone + 0.08;
  const normVis = t < T.rec || t >= T.recGone;
  const nr = $('#normrow'), rr = $('#recrow');
  nr.style.display = normVis ? '' : 'none';
  rr.style.display = recVis ? '' : 'none';
  let normA = 1;
  if (inCross) normA = 1 - crossIn;
  if (t >= T.recGone) normA = clamp((t - T.recGone - 0.01) / 0.07);
  nr.style.opacity = fnum(normA);

  // --- обычная строка ---
  let { s, last, fix } = inputAt(t);
  // отправка: старый текст ещё 2 кадра смазывается вправо и улетает (как в референсе)
  let sendK = -1;
  for (const e of SENDS) if (t >= e - FR && t < e + 2 * FR) { sendK = (t - (e - FR)) / (3 * FR); s = inputAt(e - 1e-3).s; }
  const txt = $('#txt');
  const blink = (t - last) < .45 || Math.floor((t - last) / .45) % 2 === 1;
  const cur = blink && sendK < 0 ? `<span class="cur${s ? '' : ' idle'}"></span>` : '';
  let html;
  if (s) {
    const i = s.lastIndexOf(' ') + 1, w = s.slice(i);
    const ended = TYPE_END.some(e => t >= e - 1e-6) && !(t >= T.m6Type[0] && t < T.m6Send) ? true : fix;
    const composing = !ended && sendK < 0;
    html = esc(s.slice(0, i)) + (composing && w ? `<u>${esc(w)}</u>` : esc(w)) + cur;
  } else {
    html = cur + '<span class="ph">Сообщение</span>';
  }
  if (html !== lastTxt) { txt.innerHTML = html; lastTxt = html; }
  if (sendK >= 0) {
    txt.style.filter = 'url(#hb)';
    setBlur('#hbg', 3 + 9 * sendK, 0);
    txt.style.transform = `translate(${(30 * sendK * sendK).toFixed(1)}px, ${(-14 * sendK * sendK).toFixed(1)}px)`;
    txt.style.opacity = fnum(1 - 0.55 * sendK);
  } else { txt.style.filter = ''; txt.style.transform = ''; txt.style.opacity = ''; }
  // левая иконка (пока видна корзина после отмены — иконки нет)
  const trashOn = t >= T.recCancel && t < 11.08;
  const left = trashOn ? 'none' : s ? 'smile' : 'sticker';
  const li = $('#lefticon');
  if (li.dataset.k !== left) { li.innerHTML = left === 'none' ? '' : ICON[left]; li.dataset.k = left; }
  // большой круг после отмены держится до recCircleOff — он закрывает кнопку и скрепку
  const circleAfter = t >= T.recGone && t < T.recCircleOff + 0.07;
  const inM5 = t >= T.m5Type[0] && t < T.m5Send + 2 * FR;
  $('#clip').style.display = !circleAfter && (!s || inM5) ? '' : 'none';
  const bk = s ? 'send' : (t >= T.m2Send + 2 * FR && t < T.tooltip[0] ? 'cam' : 'mic');
  const bs = $('#btn svg');
  if (bs.dataset.k !== bk) { bs.innerHTML = ICON[bk]; bs.dataset.k = bk; }
  $('#btn').style.display = circleAfter ? 'none' : '';

  // --- корзина при отмене: серый контур, затем красная «вырастает»; исчезает с уменьшением ---
  const tr = $('#trash');
  tr.style.display = trashOn ? '' : 'none';
  if (trashOn) {
    const red = t >= T.recCancel + 0.1;
    tr.style.color = red ? '#c65a55' : '#9a9a9a';
    $('#tbody').setAttribute('fill', red ? '#c65a55' : 'none');
    $('#tstripes').style.display = red ? '' : 'none';
    let sc = 1, op = 1;
    if (red) { const g = ease((t - T.recCancel - 0.1) / 0.1); sc = lerp(0.6, 1, g); op = lerp(0.5, 1, g); }
    if (t >= 11.0) { const g = clamp((t - 11.0) / 0.08); sc *= 1 - 0.7 * g; op *= 1 - g; }
    tr.style.transform = `scale(${fnum(sc)})`;
    tr.style.opacity = fnum(op);
  }

  // --- строка записи ---
  if (recVis) {
    rr.style.opacity = fnum(inCross ? crossIn : 1);
    const stopAt = T.recStop + 1e-4;
    const rt = Math.max(0, (Math.min(t, stopAt) - T.recTimer) * T.recSpeed);
    const sec = Math.floor(rt + 1e-6), tenth = Math.floor(rt * 10 + 1e-6) % 10;
    // смена секунды: цифра прокручивается вниз (новая заходит сверху) за 2 кадра, начиная с кадра, где десятые стали 0
    const tCross = T.recTimer + sec / T.recSpeed;
    const pr = sec > 0 ? ((t - tCross) / FR + 1) / 2.5 : 9;
    const ss = String(sec).padStart(2, '0'), ps = String(Math.max(0, sec - 1)).padStart(2, '0');
    let secHtml = '';
    for (let i = 0; i < 2; i++) {
      if (pr < 1 && ss[i] !== ps[i]) {
        const y = -40 * (1 - pr);
        secHtml += `<span class="roll"><span style="transform:translateY(${y.toFixed(1)}px)">${ss[i]}</span><span style="transform:translateY(${y.toFixed(1)}px)">${ps[i]}</span></span>`;
      } else secHtml += ss[i];
    }
    $('#timer').innerHTML = `0:${secHtml},${pr < 1 ? 0 : tenth}`;
    const canceled = t >= T.recCancel;
    $('#dot').style.display = canceled ? 'none' : '';
    $('#dot').style.opacity = fnum(0.55 + 0.45 * Math.cos(2 * Math.PI * (t - T.rec) / 0.55));
    // закрепление: «ОТМЕНА» съезжает сверху, «Влево — отмена» уходит вниз
    const lk = clamp((t - 3.20) / 0.17);
    const sl = $('#slide');
    const sway = 11.3 * Math.sin(2 * Math.PI * (t - 2.58) / 0.95);    // надпись качается, как в референсе
    sl.style.opacity = fnum(1 - lk);
    sl.style.transform = `translate(${sway.toFixed(1)}px, ${(12 * lk).toFixed(1)}px)`;
    // уход таймера и «ОТМЕНА» со смазом
    const gone = clamp((t - (T.recCancel + 0.23)) / 0.07);
    const otm = $('#otm');
    otm.style.opacity = fnum(lk * (1 - gone));
    otm.style.transform = `translateY(${(-10 * (1 - lk)).toFixed(1)}px)`;
    $('#timer').style.opacity = fnum(1 - gone);
    for (const id of ['#timer', '#otm']) $(id).style.filter = gone > 0 ? 'url(#hb)' : '';
    if (gone > 0) setBlur('#hbg', 10 * gone, 0);
    // подсветка нажатия «ОТМЕНА»: полоса во всю высоту поля, растёт влево за 3 кадра
    const d = t - (T.recCancel + 0.1);
    const hl = d < 0 ? 0 : d < 0.17 ? 1 : 1 - clamp((d - 0.17) / 0.03);
    const hlLeft = d < FR ? 270 : d < 2 * FR ? 231 : 218;
    const ho = $('#otmhl');
    ho.style.opacity = fnum(hl * 0.95);
    ho.style.left = hlLeft + 'px';
    ho.style.width = (522 - hlLeft) + 'px';
  }

  // --- большой круг, замок, «один раз», пауза ---
  const bc = $('#bigc');
  let bigS = 0;
  if (t >= T.recFade && t < T.recCircleOff + 0.07) {
    bigS = inCross ? lerp(0.6, 1, ease(crossIn)) : 1;
    if (t >= T.recCircleOff) bigS = 1 - ease((t - T.recCircleOff) / 0.07);
  }
  bc.style.display = bigS > 0.01 ? '' : 'none';
  bc.style.transform = `scale(${fnum(bigS)})`;
  bc.style.opacity = fnum(inCross ? crossIn : 1);
  const lk2 = clamp((t - 3.18) / 0.04);
  $('#bmic').style.opacity = fnum(1 - lk2);
  $('#bsend').style.opacity = fnum(lk2);
  // плашка замка появляется с 2.20 и растёт 3 кадра; перед закреплением дужка открывается
  const lockIn = ease((t - 2.20) / 0.1);
  const lp = $('#lock');
  lp.style.display = t >= 2.20 && t < T.recLock ? '' : 'none';
  lp.style.opacity = fnum(lockIn);
  lp.style.transform = `scale(${fnum(lerp(0.6, 1, lockIn))})`;
  $('#shackle').setAttribute('d', t >= 3.075 ? 'M20.5 44v-11a9.5 9.5 0 0 1 19 0' : 'M20.5 44v-7a9.5 9.5 0 0 1 19 0v7');
  // закрепление: кружок с замком улетает вверх, стоит, «переливается» в «1» и опускается на место
  const on = $('#once');
  const onceVis = t >= T.recLock && t < T.recCircleOff + 0.07;
  on.style.display = onceVis ? '' : 'none';
  if (onceVis) {
    let cy, vb = 0;
    if (t < 3.15) { const k = clamp((t - T.recLock) / (3.15 - T.recLock)); cy = lerp(330, 217, ease(k)); vb = 8 * (1 - k) + 3; }
    else if (t < 3.30) cy = 217;
    else if (t < 3.48) { const k = clamp((t - 3.30) / 0.18); cy = lerp(217, 252, ease(k)); vb = t >= 3.32 && t < 3.40 ? 7 : 0; }
    else cy = lerp(252, 265, ease((t - 3.48) / 0.12));
    on.style.top = (cy - 34).toFixed(1) + 'px';
    on.style.filter = vb ? 'url(#pb)' : '';
    if (vb) setBlur('#pbg', 0, vb);
    const isLock = t < 3.40;
    $('#lockIcon').style.display = isLock ? '' : 'none';
    $('#onceIcon').style.display = isLock ? 'none' : '';
    on.style.opacity = fnum(t >= T.recCircleOff ? 1 - ease((t - T.recCircleOff) / 0.07) : 1);
  }
  // пауза выезжает сверху вниз со смазом и замедлением (центры по кадрам референса)
  const pa = $('#pause');
  const pauseVis = t >= 3.38 && t < T.recCircleOff + 0.07;
  pa.style.display = pauseVis ? '' : 'none';
  if (pauseVis) {
    const PK = [[3.38, 280], [3.40, 289], [3.45, 300], [3.50, 343], [3.55, 347], [3.60, 362]];
    let cy = 362;
    for (let i = 1; i < PK.length; i++) if (t < PK[i][0]) { const [a0, y0] = PK[i - 1], [a1, y1] = PK[i]; cy = lerp(y0, y1, (t - a0) / (a1 - a0)); break; }
    pa.style.top = (cy - 34).toFixed(1) + 'px';
    const pb = t < 3.48 ? 6 : 0;
    if (!(onceVis && on.style.filter)) setBlur('#pbg', 0, pb);
    pa.style.filter = pb ? 'url(#pb)' : '';
    pa.style.opacity = fnum(t >= T.recCircleOff ? 1 - ease((t - T.recCircleOff) / 0.07) : 1);
  }
  // подсказка: мягкое появление ~0.2 с и затухание 2.17–2.37
  const tipIn = ease((t - T.tooltip[0]) / 0.2);
  const tipOut = Math.pow(clamp(1 - (t - (T.tooltip[1] - 0.01)) / 0.2), 1.6);
  $('#tip').style.opacity = fnum(t < T.tooltip[0] ? 0 : tipIn * tipOut);

  // ================= лента =================
  const vis = msgs.filter(m => m.t <= t);
  msgs.forEach(m => { m.el.style.display = m.t <= t ? '' : 'none'; m.el.style.opacity = ''; });
  vis.forEach((m, i) => {
    const prev = vis[i - 1], next = vis[i + 1];
    m.el.classList.toggle('cont', !!prev && prev.side === m.side);
    m.el.classList.toggle('tailed', !m.sticker && (!next || next.side !== m.side));
    if (m.status === 'pending') {
      const st = t < T.m2Delivered ? 'pending' : t < T.m2Read ? 'sent' : 'read';
      const el = m.el.querySelector('.st');
      if (el.dataset.k !== st) {
        el.innerHTML = st === 'pending' ? CLOCK('#bdb69a') : st === 'sent' ? CHECK1('#bdb69a') : CHECK2('#e0c87d');
        el.dataset.k = st;
      }
    }
  });
  // прокрутка: 2 кадра лента «тянется» (новый пузырь скрыт), затем быстрый ease-out
  const list = $('#list');
  let off = 0;
  vis.forEach(m => {
    if (m.t < 0) return;
    const n = Math.floor((t - m.t) / FR + 1e-6);
    if (n < REMAIN.length) {
      off += (m.el.offsetHeight + parseFloat(getComputedStyle(m.el).marginTop)) * REMAIN[n];
      if (n < 2) m.el.style.opacity = '0';
    }
  });
  list.style.transform = off ? `translateY(${off.toFixed(2)}px)` : '';
  // рывок: вертикальный смаз области чата, следует за движением
  const pv = punchAt(t);
  $('#chatwrap').style.filter = pv > 0 ? 'url(#vb)' : '';
  setBlur('#vbg', 0, pv);
  // смаз нижней панели: кроссфейд записи и отправка сообщения
  let barB = 0;
  for (const e of SENDS) { const n = Math.floor((t - e) / FR + 1e-6); if (n >= 0 && n < 2) barB = n === 0 ? 2.2 : 1.6; }
  if (inCross) barB = Math.max(barB, 4 * Math.sin(crossIn * Math.PI));
  $('#bar').style.filter = barB > 0.05 ? 'url(#bb)' : '';
  setBlur('#bbg', barB, barB * 0.6);

  // ================= камера: финальный наезд =================
  const ph = $('#phone');
  let z = 1, tx = 0, ty = 0;
  if (t >= T.zoom) {
    ph.style.transform = `scaleX(${SX})`;
    const pr = ph.getBoundingClientRect();
    const r7 = msgs[7].el.querySelector('.b').getBoundingClientRect(), r8 = msgs[8].el.querySelector('.b').getBoundingClientRect();
    const toP = (x, y) => ({ x: (x - pr.left) / SX, y: y - pr.top });
    const L = toP(Math.min(r7.left, r8.left), r7.top), R = toP(Math.max(r7.right, r8.right), r8.bottom);
    const P = { x: L.x + (R.x - L.x) * 0.40, y: (L.y + R.y) / 2 };
    const S0 = { x: P.x * SX, y: P.y };
    z = zoomAt(t);
    const k = clamp((z - 1) / 1.42);
    const step = Math.floor((t - T.zoom) / 0.05);
    const j = t >= T.glitch ? (((step * 7919) % 13) / 13 - 0.5) : 0;
    z += 0.02 * j;
    const F = { x: lerp(S0.x, 240, Math.min(1, k * 1.6)) + 8 * j, y: lerp(S0.y, 300, Math.min(1, k * 1.6)) + 5 * j };
    tx = F.x - P.x * SX * z; ty = F.y - P.y * z;
    tx = clamp(tx, 576 - 764 * SX * z, 0); ty = clamp(ty, 576 - 576 * z, 0);
  }
  ph.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${(z * SX).toFixed(5)}, ${z.toFixed(5)})`;
  return true;
};

build();
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))])
  .then(() => { sizeSpacers(); render(0); return true; });
</script>
</body>
</html>
