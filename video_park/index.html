<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Это весело</title>
<style>
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;src:url(fonts/roboto-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116;}
@font-face{font-family:'Roboto';font-style:normal;font-weight:100 900;src:url(fonts/roboto-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
:root{
  --wall:#d3dde9; --out:#fff8df; --in:#fbfcfb; --ink:#2f3440;
  --out-time:#bdb69a; --in-time:#b3b6b6; --blue:#4a7af7;
}
html,body{margin:0;width:576px;height:576px;background:#000;overflow:hidden;font-family:'Roboto',sans-serif;-webkit-font-smoothing:antialiased}
#cam{position:absolute;inset:0;overflow:hidden;background:#000}
/* экран телефона рисуется шириной 764 и сжимается до 576 — как в референсе (вертикальная запись втиснута в квадрат) */
#phone{position:absolute;left:0;top:0;width:764px;height:576px;transform-origin:0 0;background:var(--wall);overflow:hidden}
#chatwrap{position:absolute;left:0;top:0;width:764px;height:576px}
#list{position:absolute;left:0;right:0;bottom:131px;display:flex;flex-direction:column}
.row{display:flex;margin-top:16px;padding:0 17px 0 9px}
.row.cont{margin-top:4px}
.row.out{justify-content:flex-end}
.b{position:relative;max-width:600px;box-sizing:border-box;padding:13px 25px 15px 24px;border-radius:19px;
  font-size:32px;line-height:37px;color:var(--ink);letter-spacing:.1px}
.out .b{background:var(--out);padding-right:13px}
.in .b{background:var(--in)}
.in:not(.tailed) .b{border-bottom-left-radius:6px} .in.cont .b{border-top-left-radius:6px}
.out:not(.tailed) .b{border-bottom-right-radius:6px} .out.cont .b{border-top-right-radius:6px}
.b .sp{display:inline-block;height:1px}
.b .tm{position:absolute;right:25px;bottom:11px;font-size:25px;line-height:28px;display:flex;align-items:center;gap:4px}
.out .b .tm{right:13px}
.in .b .tm{color:var(--in-time)}
.out .b .tm{color:var(--out-time)}
.tm svg{display:block}
.tail{position:absolute;bottom:0;width:20px;height:20px;display:none}
.in .tail{left:-8px}
.out .tail{right:-8px;transform:scaleX(-1)}
.row.tailed .tail{display:block}
.in.tailed .b{border-bottom-left-radius:7px}
.out.tailed .b{border-bottom-right-radius:7px}
.in .tail path{fill:var(--in)} .out .tail path{fill:var(--out)}
.stk{position:relative;width:330px;height:330px;margin-right:6px}
.stk img{width:100%;height:100%;display:block}
.stk .tm,.vid .tm{position:absolute;right:13px;bottom:16px;background:rgba(40,40,45,.35);color:#fff;font-size:25px;line-height:28px;
  padding:1px 12px;border-radius:16px;display:flex;align-items:center;gap:4px}
/* видео в чате */
.vid{position:relative;width:440px;height:300px;border-radius:19px;overflow:hidden;background:#222}
.vid svg.pic{position:absolute;inset:0}
.vid .dur{position:absolute;left:14px;top:14px;background:rgba(20,20,25,.5);color:#fff;font-size:24px;line-height:28px;padding:2px 12px;border-radius:15px}
.vid .play{position:absolute;left:50%;top:50%;width:88px;height:88px;margin:-44px 0 0 -44px;border-radius:50%;background:rgba(15,15,20,.5)}

#bar{position:absolute;left:5px;right:5px;top:466px;height:100px;background:#fcfcfc;border-radius:50px;overflow:hidden}
.ic{position:absolute}
#lefticon{left:13px;top:22px}
#txtwrap{position:absolute;left:94px;right:190px;top:28px;height:44px;overflow:hidden}
#txt{font-size:36px;line-height:44px;color:var(--ink);white-space:nowrap;position:absolute;right:auto;left:0}
#txt .ph{color:#9d9d9d}
#txt u{text-decoration:none;border-bottom:3px solid #2a2a2a;padding-bottom:0}
.cur{display:inline-block;width:3px;height:46px;background:#6a6c78;vertical-align:-11px;margin:0 -1px}
.cur.idle{background:var(--blue)}
#clip{left:588px;top:21px}
#btn{position:absolute;left:672px;top:19.5px;width:74px;height:74px;border-radius:50%;background:var(--blue)}
#btn svg{position:absolute;inset:0}
#defs{position:absolute;width:0;height:0}
</style>
</head>
<body>
<svg id="defs">
  <filter id="vb" x="-2%" y="-10%" width="104%" height="120%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter>
  <filter id="hb" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur id="hbg" stdDeviation="0 0"/></filter>
  <filter id="bb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="bbg" stdDeviation="0 0"/></filter>
</svg>
<div id="cam">
 <div id="phone">
  <div id="chatwrap"><div id="list"></div></div>
  <div id="bar">
    <svg class="ic" id="lefticon" width="64" height="64" viewBox="0 0 42 42"></svg>
    <div id="txtwrap"><div id="txt"></div></div>
    <svg class="ic" id="clip" width="66" height="66" viewBox="0 0 40 40"><path d="M26 11.5 14.6 23a3.5 3.5 0 0 0 5 5L31.5 16a6.4 6.4 0 0 0-9-9L10.4 19.1a9.3 9.3 0 0 0 13.2 13.2l9.2-9.2" fill="none" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div id="btn"><svg width="74" height="74" viewBox="0 0 62 62"></svg></div>
  </div>
 </div>
</div>
<script src="scene.js"></script>
<script>
const S = window.SCENE, T = S.t;
const $ = s => document.querySelector(s);
const SX = 576 / 764;
const FR = 1 / 30;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = p => { p = clamp(p); return 1 - Math.pow(1 - p, 3); };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const fnum = x => x.toFixed(3);

const ICON = {
  smile: '<circle cx="21" cy="21" r="15" fill="none" stroke="#7d7d7d" stroke-width="2.6"/><circle cx="15.8" cy="17.5" r="2" fill="#7d7d7d"/><circle cx="26.2" cy="17.5" r="2" fill="#7d7d7d"/><path d="M14.5 24.5c3.6 4.4 9.4 4.4 13 0" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linecap="round"/>',
  sticker: '<path d="M8 13a6 6 0 0 1 6-6h14a6 6 0 0 1 6 6v9L23 35h-9a6 6 0 0 1-6-6Z" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linejoin="round"/><path d="M34 22h-6a5 5 0 0 0-5 5v8" fill="none" stroke="#7d7d7d" stroke-width="2.6" stroke-linejoin="round"/><circle cx="16" cy="17.5" r="2" fill="#7d7d7d"/><circle cx="25" cy="17.5" r="2" fill="#7d7d7d"/><path d="M15 23.5c1.8 2 4.6 2.6 7 1.6" fill="none" stroke="#7d7d7d" stroke-width="2.4" stroke-linecap="round"/>',
  send: '<path d="M16 30.5 45 18.5 37 45l-7-10Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M30 35 45 18.5" stroke="#4a7af7" stroke-width="2"/>',
  mic: '<rect x="26" y="15" width="10" height="20" rx="5" fill="#fff"/><path d="M20.5 29a10.5 10.5 0 0 0 21 0M31 40v5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>',
};
const TAIL = '<svg class="tail" viewBox="0 0 20 20"><path d="M8 0V10C8 14.5 5 18 0 20H14C16 20 18 20 20 20V0Z"/></svg>';
const CHECK2 = c => `<svg width="30" height="22" viewBox="1 0 21 16"><path d="M2 8.5 6.5 13 15.5 3M12 13 21.5 3" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CHECK1 = c => `<svg width="30" height="22" viewBox="1 0 21 16"><path d="M5 8.5 9.5 13 18.5 3" fill="none" stroke="${c}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// кадр из «видео»: вечерний парк, размытые силуэты (нарисовано с нуля)
const VIDEO_PIC = `<svg class="pic" width="440" height="300" viewBox="0 0 440 300" preserveAspectRatio="none">
  <defs><filter id="vbl"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b5f72"/><stop offset=".55" stop-color="#9a8a7a"/><stop offset="1" stop-color="#3b4336"/></linearGradient></defs>
  <g filter="url(#vbl)">
    <rect width="440" height="300" fill="url(#sky)"/>
    <path d="M0 150C40 90 70 120 90 80 120 40 150 110 170 95 200 70 230 120 250 100 290 60 320 110 350 90 380 70 410 110 440 100V300H0Z" fill="#2c3628"/>
    <rect y="210" width="440" height="90" fill="#4a4a42"/>
    <ellipse cx="150" cy="200" rx="22" ry="52" fill="#1d1d22"/><circle cx="150" cy="138" r="16" fill="#1d1d22"/>
    <ellipse cx="265" cy="205" rx="25" ry="56" fill="#26232a"/><circle cx="265" cy="140" r="17" fill="#26232a"/>
    <ellipse cx="330" cy="215" rx="18" ry="44" fill="#1a1a1e"/><circle cx="330" cy="164" r="13" fill="#1a1a1e"/>
    <ellipse cx="205" cy="250" rx="34" ry="20" fill="#2a2a30"/>
    <circle cx="380" cy="60" r="18" fill="#e8d9a8" opacity=".6"/>
  </g></svg>`;

// ---------- сообщения ----------
const msgs = S.messages.map(m => ({ ...m }));
const EVENTS = msgs.filter(m => m.t > 0).map(m => m.t);
const SENDS = msgs.filter(m => m.t > 0 && m.side === 'out' && m.type).map(m => m.t);
window.MSGS = msgs.map(m => ({ t: m.t, side: m.side, kind: m.sticker ? 'sticker' : m.video ? 'video' : 'text' }));

function build() {
  const list = $('#list');
  msgs.forEach(m => {
    const row = document.createElement('div');
    row.className = 'row ' + m.side;
    const st = m.side === 'out' ? CHECK2('#e0c87d') : '';
    if (m.sticker) {
      row.innerHTML = `<div class="stk"><img src="sticker.svg"><span class="tm">${m.time}${CHECK2('#fff')}</span></div>`;
    } else if (m.video) {
      row.innerHTML = `<div class="vid">${VIDEO_PIC}<div class="dur">${m.video}</div><div class="play"><svg width="88" height="88" viewBox="0 0 88 88"><path d="M35 27 63 44 35 61Z" fill="#fff"/></svg></div><span class="tm">${m.time}</span></div>`;
    } else {
      row.innerHTML = `<div class="b">${TAIL}<span class="tx">${esc(m.text)}</span><span class="sp"></span><span class="tm"><span>${m.time}</span><span class="st">${st}</span></span></div>`;
    }
    list.appendChild(row);
    m.el = row;
  });
}
function sizeSpacers() {
  msgs.forEach(m => {
    if (m.sticker || m.video) return;
    m.el.style.display = '';
    const tm = m.el.querySelector('.tm');
    m.el.querySelector('.sp').style.width = (tm.offsetWidth + 20) + 'px';
  });
}

// ---------- набор текста (с возможностью стирать) ----------
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const KEYS = [];
function addPart(from, to, a, b) {
  let k = 0; while (k < from.length && k < to.length && from[k] === to[k]) k++;
  const ops = [];
  for (let i = from.length; i > k; i--) ops.push(from.slice(0, i - 1));
  for (let i = k + 1; i <= to.length; i++) ops.push(to.slice(0, i));
  const w = ops.map(() => .6 + rnd() * .8), tot = w.reduce((x, y) => x + y, 0);
  let acc = 0;
  ops.forEach((s, i) => { acc += w[i]; KEYS.push({ t: a + (b - a) * acc / tot, s }); });
}
const TYPE_END = [];
msgs.forEach(m => {
  if (!m.type) return;
  let cur = '';
  m.type.forEach(p => { addPart(cur, p.to, p.a, p.b); cur = p.to; });
  TYPE_END.push([m.type[m.type.length - 1].b, m.t]);
  KEYS.push({ t: m.t, s: '', send: true });
});
KEYS.sort((x, y) => x.t - y.t);
window.KEYS = KEYS.map(k => ({ t: k.t, send: !!k.send }));
function inputAt(t) { let s = '', last = -9; for (const k of KEYS) { if (k.t <= t) { s = k.s; last = k.t; } else break; } return { s, last }; }

// «рывок»: вертикальный смаз; прокрутка: 2 кадра «тянется», затем быстрый ease-out (как в «Чья будете»)
const PUNCH_PROFILE = [2.6, 4.2, 3.6, 3.0, 2.4, 1.6, 1.0, 0.4];
const REMAIN = [0.9, 0.9, 0.5, 0.3, 0.16, 0.09, 0.05, 0.03];
function punchAt(t) {
  let v = 0;
  for (const e of EVENTS) { const n = Math.floor((t - e) / FR + 1e-6); if (n >= 0 && n < PUNCH_PROFILE.length) v = Math.max(v, PUNCH_PROFILE[n]); }
  return v;
}
function setBlur(id, x, y) { $(id).setAttribute('stdDeviation', `${x.toFixed(2)} ${y.toFixed(2)}`); }

let lastTxt = null;
window.render = function (t) {
  // --- поле ввода ---
  let { s, last } = inputAt(t);
  let sendK = -1;
  for (const e of SENDS) if (t >= e - FR && t < e + 2 * FR) { sendK = (t - (e - FR)) / (3 * FR); s = inputAt(e - 1e-3).s; }
  const blink = (t - last) < .45 || Math.floor((t - last) / .45) % 2 === 1;
  const cur = blink && sendK < 0 ? `<span class="cur${s ? '' : ' idle'}"></span>` : '';
  let html;
  if (s) {
    const i = s.lastIndexOf(' ') + 1, w = s.slice(i);
    const composing = sendK < 0 && !TYPE_END.some(([e, snd]) => t >= e && t < snd);
    html = esc(s.slice(0, i)) + (composing && w ? `<u>${esc(w)}</u>` : esc(w)) + cur;
  } else html = cur + '<span class="ph">Сообщение</span>';
  const txt = $('#txt');
  if (html !== lastTxt) { txt.innerHTML = html; lastTxt = html; }
  // длинный текст уезжает влево, чтобы курсор оставался виден
  const over = Math.max(0, txt.scrollWidth - $('#txtwrap').clientWidth + 6);
  let tr = `translateX(${-over}px)`;
  if (sendK >= 0) {
    txt.style.filter = 'url(#hb)';
    setBlur('#hbg', 3 + 9 * sendK, 0);
    tr = `translate(${(-over + 30 * sendK * sendK).toFixed(1)}px, ${(-14 * sendK * sendK).toFixed(1)}px)`;
    txt.style.opacity = fnum(1 - 0.55 * sendK);
  } else { txt.style.filter = ''; txt.style.opacity = ''; }
  txt.style.transform = tr;
  const li = $('#lefticon'), left = s ? 'smile' : 'sticker';
  if (li.dataset.k !== left) { li.innerHTML = ICON[left]; li.dataset.k = left; }
  $('#clip').style.display = s ? 'none' : '';
  const bs = $('#btn svg'), bk = s ? 'send' : 'mic';
  if (bs.dataset.k !== bk) { bs.innerHTML = ICON[bk]; bs.dataset.k = bk; }

  // --- лента ---
  const vis = msgs.filter(m => m.t <= t);
  msgs.forEach(m => { m.el.style.display = m.t <= t ? '' : 'none'; m.el.style.opacity = ''; });
  vis.forEach((m, i) => {
    const prev = vis[i - 1], next = vis[i + 1];
    const media = x => x && (x.sticker || x.video);
    m.el.classList.toggle('cont', !!prev && prev.side === m.side && !media(prev) && !media(m));
    m.el.classList.toggle('tailed', !media(m) && (!next || next.side !== m.side || media(next)));
    if (m.side === 'out' && !m.sticker) {
      const read = t >= m.t + 0.45;
      const el = m.el.querySelector('.st');
      const k = read ? 'r' : 's';
      if (el.dataset.k !== k) { el.innerHTML = read ? CHECK2('#e0c87d') : CHECK1('#bdb69a'); el.dataset.k = k; }
    }
  });
  const list = $('#list');
  let off = 0;
  vis.forEach(m => {
    if (m.t < 0) return;
    const n = Math.floor((t - m.t) / FR + 1e-6);
    if (n < REMAIN.length) {
      off += (m.el.offsetHeight + parseFloat(getComputedStyle(m.el).marginTop)) * REMAIN[n];
      if (n < 2) m.el.style.opacity = '0';
    }
  });
  list.style.transform = off ? `translateY(${off.toFixed(2)}px)` : '';
  const pv = punchAt(t);
  $('#chatwrap').style.filter = pv > 0 ? 'url(#vb)' : '';
  setBlur('#vbg', 0, pv);
  let barB = 0;
  for (const e of SENDS) { const n = Math.floor((t - e) / FR + 1e-6); if (n >= 0 && n < 2) barB = n === 0 ? 2.2 : 1.6; }
  $('#bar').style.filter = barB ? 'url(#bb)' : '';
  setBlur('#bbg', barB, barB * 0.6);

  // --- камера: медленный наезд на последнее сообщение ---
  const ph = $('#phone');
  let z = 1, tx = 0, ty = 0;
  if (t >= T.zoom) {
    ph.style.transform = `scaleX(${SX})`;
    const pr = ph.getBoundingClientRect();
    const r = msgs[msgs.length - 1].el.querySelector('.b').getBoundingClientRect();
    const P = { x: ((r.left + r.right) / 2 - pr.left) / SX * 0.85 + ((r.left - pr.left) / SX) * 0.15, y: (r.top + r.bottom) / 2 - pr.top };
    const k = clamp((t - T.zoom) / (T.black - T.zoom));
    z = 1 + 0.4 * k * k;
    const S0 = { x: P.x * SX, y: P.y };
    const F = { x: lerp(S0.x, 288, k), y: lerp(S0.y, 290, k) };
    tx = clamp(F.x - P.x * SX * z, 576 - 764 * SX * z, 0); ty = clamp(F.y - P.y * z, 576 - 576 * z, 0);
  }
  ph.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${(z * SX).toFixed(5)}, ${z.toFixed(5)})`;
  return true;
};

build();
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.complete ? 1 : new Promise(r => { i.onload = r; i.onerror = r; }))])
  .then(() => { sizeSpacers(); render(0); return true; });
</script>
</body>
</html>
